<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG 151 Collector & Pack Simulator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121218;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      user-select: none;
    }

    h1 {
      color: #ffcb05;
      text-shadow: 2px 2px #3b4cca;
      margin-bottom: 5px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background-color: #2a2a38;
      color: #fff;
      border: 2px solid #3b4cca;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #ffcb05;
      color: #121218;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Interactive Pack Swipe Area */
    #pack-container {
      position: relative;
      width: 240px;
      height: 360px;
      margin: 30px auto;
      perspective: 1000px;
    }

    .pack-foil {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border: 3px solid #ffcb05;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .pack-foil h2 { color: #ffcb05; margin: 0; font-size: 32px; text-shadow: 2px 2px #000; }
    .pack-foil p { color: #fff; margin-top: 10px; font-weight: bold; }

    .pack-top-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(255, 203, 5, 0.3);
      border-bottom: 2px dashed #ffcb05;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      pointer-events: none;
    }

    /* Single Card Reveal Mechanics */
    #reveal-area {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .card-flipper {
      width: 220px;
      height: 308px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card-flipper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .card-back {
      background: #1e1e2d;
      border: 3px solid #ffcb05;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back::after {
      content: 'Pokémon';
      color: #ffcb05;
      font-weight: bold;
      font-size: 24px;
      text-shadow: 2px 2px #3b4cca;
    }

    .card-front {
      transform: rotateY(180deg);
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Grid layout for Binder / Dex */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      width: 140px;
      height: 196px;
      background-color: #2a2a38;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.unowned img { filter: brightness(0.2) grayscale(1); }

    .card-count {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #ffcb05;
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 24px;
      font-size: 12px;
    }

    .status {
      font-size: 16px;
      color: #00d26a;
      margin-top: 10px;
    }

    .next-btn {
      background-color: #ffcb05;
      color: #121218;
      border: none;
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Pokémon 151 TCG Simulator</h1>
  
  <nav>
    <button class="nav-btn active" onclick="switchTab('pack-tab')">Open Pack</button>
    <button class="nav-btn" onclick="switchTab('binder-tab')">My Binder</button>
    <button class="nav-btn" onclick="switchTab('dex-tab')">Card Dex (151)</button>
  </nav>

  <div id="status" class="status">Loading 151 set data...</div>

  <!-- TAB 1: OPEN PACK -->
  <div id="pack-tab" class="tab-content active">
    <div id="pack-container">
      <div id="pack-foil" class="pack-foil">
        <div class="pack-top-strip">Swipe across top to tear</div>
        <h2>151</h2>
        <p>BOOSTER PACK</p>
      </div>
    </div>

    <div id="reveal-area">
      <div id="card-flipper" class="card-flipper" onclick="flipCurrentCard()">
        <div class="card-inner">
          <div class="card-back"></div>
          <div class="card-front">
            <img id="current-card-img" src="" alt="Card">
          </div>
        </div>
      </div>
      <p id="card-counter-text">Card 1 of 10</p>
      <button id="next-card-btn" class="next-btn" onclick="nextCard()" style="display:none;">Next Card &gt;</button>
      <button id="reset-pack-btn" class="next-btn" onclick="resetPackView()" style="display:none;">Open Another Pack</button>
    </div>
  </div>

  <!-- TAB 2: BINDER -->
  <div id="binder-tab" class="tab-content">
    <h2>My Collected Cards</h2>
    <div id="binder-grid" class="card-grid"></div>
  </div>

  <!-- TAB 3: CARD DEX -->
  <div id="dex-tab" class="tab-content">
    <h2>151 Master Set Dex (0/207)</h2>
    <div id="dex-grid" class="card-grid"></div>
  </div>

  <script>
    const SET_ID = 'sv3pt5';
    let cardDatabase = [];
    let collection = JSON.parse(localStorage.getItem('pkm151_collection')) || {};
    let isReady = false;

    let currentPack = [];
    let currentCardIndex = 0;
    let isCardFlipped = false;

    let startX = 0;
    let startY = 0;

    let goldPsychicEnergyCard = null;

    let cardPool = {
      common: [],
      uncommon: [],
      rare: [],
      doubleRare: [],
      ultraRare: [],
      illustrationRare: [],
      specialIllustrationRare: [],
      hyperRare: [],
      energy: []
    };

    async function loadSetData() {
      try {
        const response = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${SET_ID}&orderBy=number`);
        const data = await response.json();
        
        cardDatabase = data.data.sort((a, b) => parseInt(a.number) - parseInt(b.number));

        cardDatabase.forEach(card => {
          const rarity = card.rarity ? card.rarity.toLowerCase() : '';
          const supertype = card.supertype ? card.supertype.toLowerCase() : '';
          const num = parseInt(card.number);

          // Find the specific Gold Psychic Energy card (#207)
          if (num === 207) {
            goldPsychicEnergyCard = card;
          }

          if (supertype === 'energy') {
            cardPool.energy.push(card);
          } else if (rarity.includes('hyper rare')) {
            cardPool.hyperRare.push(card);
          } else if (rarity.includes('special illustration')) {
            cardPool.specialIllustrationRare.push(card);
          } else if (rarity.includes('ultra rare')) {
            cardPool.ultraRare.push(card);
          } else if (rarity.includes('illustration')) {
            cardPool.illustrationRare.push(card);
          } else if (rarity.includes('double rare')) {
            cardPool.doubleRare.push(card);
          } else if (rarity.includes('uncommon')) {
            cardPool.uncommon.push(card);
          } else if (rarity.includes('common')) {
            cardPool.common.push(card);
          } else {
            cardPool.rare.push(card);
          }
        });

        document.getElementById('status').innerText = "151 Set Ready! Swipe top of booster pack to open.";
        isReady = true;
        setupSwipeEvents();
        renderDex();
        renderBinder();
      } catch (err) {
        document.getElementById('status').innerText = "Error loading set. Please refresh.";
        console.error(err);
      }
    }

    function getRandomCard(pool) {
      if (!pool || pool.length === 0) return cardPool.common[0];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function rollHitSlot() {
      const roll = Math.random() * 100;
      if (roll < 1.94) return getRandomCard(cardPool.hyperRare);
      if (roll < (1.94 + 3.11)) return getRandomCard(cardPool.specialIllustrationRare);
      if (roll < (1.94 + 3.11 + 6.44)) return getRandomCard(cardPool.ultraRare);
      if (roll < (1.94 + 3.11 + 6.44 + 8.50)) return getRandomCard(cardPool.illustrationRare);
      if (roll < (1.94 + 3.11 + 6.44 + 8.50 + 13.28)) return getRandomCard(cardPool.doubleRare);
      return getRandomCard(cardPool.rare);
    }

    function setupSwipeEvents() {
      const foil = document.getElementById('pack-foil');

      foil.addEventListener('mousedown', (e) => { startX = e.clientX; startY = e.clientY; });
      foil.addEventListener('mouseup', (e) => { checkSwipe(e.clientX, e.clientY); });

      foil.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      });
      foil.addEventListener('touchend', (e) => {
        checkSwipe(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      });
    }

    function checkSwipe(endX, endY) {
      const diffX = Math.abs(endX - startX);
      const diffY = Math.abs(endY - startY);

      if (diffX > 50 || diffY > 50) {
        tearPack();
      }
    }

    function tearPack() {
      if (!isReady) return;

      document.getElementById('pack-container').style.display = 'none';
      document.getElementById('reveal-area').style.display = 'flex';

      generatePack();
      currentCardIndex = 0;
      showCard(currentCardIndex);
    }

    function generatePack() {
      currentPack = [];

      // Slots 1-4: Common
      for (let i = 0; i < 4; i++) currentPack.push(getRandomCard(cardPool.common));
      
      // Slots 5-6: Uncommon
      for (let i = 0; i < 2; i++) currentPack.push(getRandomCard(cardPool.uncommon));

      // Slot 7: GUARANTEED Gold Psychic Energy Card (#207)
      currentPack.push(goldPsychicEnergyCard || getRandomCard(cardPool.hyperRare));

      // Slot 8: Basic Energy
      currentPack.push(getRandomCard(cardPool.energy));

      // Slot 9: Reverse Holo
      currentPack.push(getRandomCard([...cardPool.common, ...cardPool.uncommon, ...cardPool.rare]));

      // Slot 10: Hit Slot (Exact 151 Odds Roll)
      currentPack.push(rollHitSlot());

      // Save to collection
      currentPack.forEach(card => {
        collection[card.id] = (collection[card.id] || 0) + 1;
      });

      localStorage.setItem('pkm151_collection', JSON.stringify(collection));
      renderBinder();
      renderDex();
    }

    function showCard(index) {
      isCardFlipped = false;
      const flipper = document.getElementById('card-flipper');
      flipper.classList.remove('flipped');

      const card = currentPack[index];
      document.getElementById('current-card-img').src = card.images.small;
      document.getElementById('card-counter-text').innerText = `Card ${index + 1} of 10`;

      document.getElementById('next-card-btn').style.display = 'none';
      document.getElementById('reset-pack-btn').style.display = 'none';
    }

    function flipCurrentCard() {
      if (isCardFlipped) return;
      isCardFlipped = true;

      document.getElementById('card-flipper').classList.add('flipped');

      if (currentCardIndex < 9) {
        document.getElementById('next-card-btn').style.display = 'inline-block';
      } else {
        document.getElementById('reset-pack-btn').style.display = 'inline-block';
      }
    }

    function nextCard() {
      if (currentCardIndex < 9) {
        currentCardIndex++;
        showCard(currentCardIndex);
      }
    }

    function resetPackView() {
      document.getElementById('reveal-area').style.display = 'none';
      document.getElementById('pack-container').style.display = 'block';
    }

    function renderBinder() {
      const binderGrid = document.getElementById('binder-grid');
      binderGrid.innerHTML = '';

      Object.keys(collection).forEach(cardId => {
        const card = cardDatabase.find(c => c.id === cardId);
        if (card) {
          const cardDiv = document.createElement('div');
          cardDiv.className = 'card';
          cardDiv.innerHTML = `
            <img src="${card.images.small}" alt="${card.name}">
            <div class="card-count">x${collection[cardId]}</div>
          `;
          binderGrid.appendChild(cardDiv);
        }
      });
    }

    function renderDex() {
      const dexGrid = document.getElementById('dex-grid');
      dexGrid.innerHTML = '';

      let totalOwned = 0;
      cardDatabase.forEach(card => {
        const count = collection[card.id] || 0;
        if (count > 0) totalOwned++;

        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${count === 0 ? 'unowned' : ''}`;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;
        dexGrid.appendChild(cardDiv);
      });

      document.querySelector('#dex-tab h2').innerText = `151 Master Set Dex (${totalOwned}/${cardDatabase.length})`;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    window.onload = loadSetData;
  </script>
</body>
</html>
