<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG 151 Collector & Pack Simulator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121218;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      user-select: none;
      overflow-x: hidden;
    }

    h1 {
      color: #ffcb05;
      text-shadow: 2px 2px #3b4cca;
      margin-bottom: 5px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background-color: #2a2a38;
      color: #fff;
      border: 2px solid #3b4cca;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #ffcb05;
      color: #121218;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- AUTHENTIC 151 PACK STYLING --- */
    .pack-stage {
      width: 250px;
      height: 430px;
      margin: 10px auto;
      perspective: 800px;
    }

    .pack-frame {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
      transform-origin: center 20%;
    }

    .pack-frame.zoomed {
      transform: scale(1.35) translateY(25px);
    }

    .booster-pack {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 3px solid #d4d4d4;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      background-image: radial-gradient(#e0e0e0 15%, transparent 16%), radial-gradient(#d5d5e1 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    .pack-crimp-top, .pack-crimp-bottom {
      width: 100%;
      height: 18px;
      background: repeating-linear-gradient(90deg, #c0c0c0, #c0c0c0 4px, #e8e8e8 4px, #e8e8e8 8px);
      border-bottom: 2px solid #aaa;
      z-index: 2;
    }
    .pack-crimp-bottom {
      border-bottom: none;
      border-top: 2px solid #aaa;
    }

    .pack-art-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 10px;
      z-index: 1;
    }

    .pack-logo {
      width: 180px;
      height: auto;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
    }

    .pack-mew-art {
      width: 160px;
      height: 160px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
    }

    .pack-151-badge {
      background: linear-gradient(135deg, #e60012, #aa000d);
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      padding: 4px 20px;
      border-radius: 6px;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px #000;
    }

    /* --- CARDS REVEAL --- */
    #reveal-area {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .card-stack {
      position: relative;
      width: 220px;
      height: 308px;
      margin-bottom: 15px;
    }

    .card-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      overflow: hidden;
      cursor: pointer;
      background-color: #2a2a38;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-item.slide-out {
      transform: translateX(130%) rotate(20deg);
      opacity: 0;
      pointer-events: none;
    }

    /* --- 4x4 BINDER GRID --- */
    .binder-container {
      max-width: 680px;
      margin: 0 auto;
      background: #1e1e28;
      border: 4px solid #3b4cca;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .binder-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      justify-items: center;
    }

    .binder-slot {
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      background: #121218;
      border: 2px dashed #444455;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .binder-slot.drag-over {
      border-color: #ffcb05;
      background-color: #2a2a38;
    }

    .binder-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: grab;
    }

    .slot-number {
      position: absolute;
      font-size: 11px;
      color: #555566;
      pointer-events: none;
    }

    .tray-area {
      margin-top: 25px;
      background: #2a2a38;
      border-radius: 10px;
      padding: 15px;
    }

    .tray-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      min-height: 120px;
      margin-top: 10px;
    }

    .tray-card {
      width: 90px;
      height: 126px;
      border-radius: 6px;
      overflow: hidden;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .tray-card:hover { transform: scale(1.05); }
    .tray-card img { width: 100%; height: 100%; object-fit: cover; }

    /* --- DEX GRID --- */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      width: 120px;
      height: 168px;
      background-color: #2a2a38;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.unowned img { filter: brightness(0.2) grayscale(1); }

    .status {
      font-size: 15px;
      color: #00d26a;
      margin-top: 10px;
    }

    .action-btn {
      background-color: #ffcb05;
      color: #121218;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s;
    }

    .action-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <h1>Pokémon 151 TCG Simulator</h1>
  
  <nav>
    <button class="nav-btn active" onclick="switchTab('pack-tab', event)">Open Pack</button>
    <button class="nav-btn" onclick="switchTab('binder-tab', event)">4x4 Binder</button>
    <button class="nav-btn" onclick="switchTab('dex-tab', event)">Card Dex</button>
  </nav>

  <div id="status" class="status">Click 'Open Pack' to begin!</div>

  <!-- TAB 1: PACK SIMULATOR -->
  <div id="pack-tab" class="tab-content active">
    <div id="pack-container">
      <div class="pack-stage">
        <div id="pack-frame" class="pack-frame">
          <div class="booster-pack">
            <div class="pack-crimp-top"></div>
            <div class="pack-art-container">
              <img class="pack-logo" src="https://images.pokemontcg.io/sv3pt5/logo.png" alt="Scarlet & Violet 151 Logo">
              <img class="pack-mew-art" src="https://images.pokemontcg.io/sv3pt5/151.png" alt="151 Mew Art">
              <div class="pack-151-badge">151</div>
            </div>
            <div class="pack-crimp-bottom"></div>
          </div>
        </div>
      </div>
      <button id="zoom-btn" class="action-btn" onclick="prepareToOpen()">Open Pack</button>
      <button id="rip-now-btn" class="action-btn" onclick="ripPack()" style="display:none; background-color: #00d26a; color:#fff;">Rip Pack Open!</button>
    </div>

    <div id="reveal-area">
      <div id="card-stack" class="card-stack"></div>
      <p id="card-counter-text">Tap top card to slide it away!</p>
      <button id="reset-pack-btn" class="action-btn" onclick="resetPackView()" style="display:none;">Open Another Pack</button>
    </div>
  </div>

  <!-- TAB 2: 4x4 BINDER -->
  <div id="binder-tab" class="tab-content">
    <h2>4x4 Interactive Binder</h2>
    <p style="font-size: 14px; color: #aaa;">Drag & drop cards into slots, or click an unbound card below!</p>
    
    <div class="binder-container">
      <div id="binder-grid" class="binder-4x4"></div>
    </div>

    <div class="tray-area">
      <h3>Unbound Cards</h3>
      <p style="font-size: 12px; color: #888;">Cards you've opened that aren't in your binder yet:</p>
      <div id="tray-grid" class="tray-grid"></div>
    </div>
  </div>

  <!-- TAB 3: CARD DEX -->
  <div id="dex-tab" class="tab-content">
    <h2>151 Master Set</h2>
    <div id="dex-grid" class="card-grid"></div>
  </div>

  <script>
    const cardDatabase = [
      { id: '1', name: 'Bulbasaur', image: 'https://images.pokemontcg.io/sv3pt5/1.png' },
      { id: '4', name: 'Charmander', image: 'https://images.pokemontcg.io/sv3pt5/4.png' },
      { id: '7', name: 'Squirtle', image: 'https://images.pokemontcg.io/sv3pt5/7.png' },
      { id: '25', name: 'Pikachu', image: 'https://images.pokemontcg.io/sv3pt5/25.png' },
      { id: '39', name: 'Jigglypuff', image: 'https://images.pokemontcg.io/sv3pt5/39.png' },
      { id: '54', name: 'Psyduck', image: 'https://images.pokemontcg.io/sv3pt5/54.png' },
      { id: '94', name: 'Gengar', image: 'https://images.pokemontcg.io/sv3pt5/94.png' },
      { id: '133', name: 'Eevee', image: 'https://images.pokemontcg.io/sv3pt5/133.png' },
      { id: '143', name: 'Snorlax', image: 'https://images.pokemontcg.io/sv3pt5/143.png' },
      { id: '150', name: 'Mewtwo', image: 'https://images.pokemontcg.io/sv3pt5/150.png' },
      { id: '151', name: 'Mew ex', image: 'https://images.pokemontcg.io/sv3pt5/151.png' },
      { id: '198', name: 'Venusaur ex', image: 'https://images.pokemontcg.io/sv3pt5/198.png' },
      { id: '199', name: 'Charizard ex', image: 'https://images.pokemontcg.io/sv3pt5/199.png' },
      { id: '200', name: 'Blastoise ex', image: 'https://images.pokemontcg.io/sv3pt5/200.png' }
    ];

    let collection = [];
    try {
      collection = JSON.parse(localStorage.getItem('pkm151_collection')) || [];
    } catch (e) {
      collection = [];
    }

    let binderSlots = [];
    try {
      binderSlots = JSON.parse(localStorage.getItem('pkm151_binder_4x4')) || Array(16).fill(null);
    } catch (e) {
      binderSlots = Array(16).fill(null);
    }

    let currentPack = [];
    let cardsRemaining = 10;
    let draggedCardInstanceId = null;

    function renderImageHTML(card) {
      return `<img src="${card.image}" alt="${card.name}" loading="lazy">`;
    }

    function prepareToOpen() {
      document.getElementById('pack-frame').classList.add('zoomed');
      document.getElementById('zoom-btn').style.display = 'none';
      document.getElementById('rip-now-btn').style.display = 'inline-block';
      document.getElementById('status').innerText = "Click 'Rip Pack Open!' to reveal your cards!";
    }

    function ripPack() {
      document.getElementById('pack-container').style.display = 'none';
      document.getElementById('reveal-area').style.display = 'flex';
      generatePack();
      renderPackStack();
    }

    function generatePack() {
      currentPack = [];
      for (let i = 0; i < 10; i++) {
        const randomIndex = Math.floor(Math.random() * cardDatabase.length);
        currentPack.push(cardDatabase[randomIndex]);
      }

      currentPack.forEach(card => {
        collection.push({
          instanceId: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          cardId: card.id
        });
      });

      localStorage.setItem('pkm151_collection', JSON.stringify(collection));
      renderBinder();
      renderDex();
    }

    function renderPackStack() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      cardsRemaining = 10;
      document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
      document.getElementById('reset-pack-btn').style.display = 'none';

      for (let i = currentPack.length - 1; i >= 0; i--) {
        const card = currentPack[i];
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.style.zIndex = currentPack.length - i;
        cardDiv.innerHTML = renderImageHTML(card);

        cardDiv.onclick = function() {
          if (!cardDiv.classList.contains('slide-out')) {
            cardDiv.classList.add('slide-out');
            cardsRemaining--;
            
            if (cardsRemaining > 0) {
              document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
            } else {
              document.getElementById('card-counter-text').innerText = `Pack finished!`;
              document.getElementById('reset-pack-btn').style.display = 'inline-block';
            }
          }
        };

        stack.appendChild(cardDiv);
      }
    }

    function resetPackView() {
      document.getElementById('pack-frame').classList.remove('zoomed');
      document.getElementById('zoom-btn').style.display = 'inline-block';
      document.getElementById('rip-now-btn').style.display = 'none';
      document.getElementById('reveal-area').style.display = 'none';
      document.getElementById('pack-container').style.display = 'block';
      document.getElementById('status').innerText = "Ready to open another pack!";
    }

    function renderBinder() {
      const binderGrid = document.getElementById('binder-grid');
      if (!binderGrid) return;
      binderGrid.innerHTML = '';

      for (let i = 0; i < 16; i++) {
        const slotDiv = document.createElement('div');
        slotDiv.className = 'binder-slot';
        slotDiv.dataset.slotIndex = i;

        const boundInstanceId = binderSlots[i];
        const itemInSlot = collection.find(c => c.instanceId === boundInstanceId);

        if (itemInSlot) {
          const cardData = cardDatabase.find(c => c.id === itemInSlot.cardId);
          if (cardData) {
            slotDiv.innerHTML = renderImageHTML(cardData);
            const imgEl = slotDiv.querySelector('img');
            if (imgEl) {
              imgEl.draggable = true;
              imgEl.ondragstart = (e) => onDragStart(e, itemInSlot.instanceId);
            }
          }
        } else {
          slotDiv.innerHTML = `<span class="slot-number">${i + 1}</span>`;
        }

        slotDiv.ondragover = (e) => { e.preventDefault(); slotDiv.classList.add('drag-over'); };
        slotDiv.ondragleave = () => { slotDiv.classList.remove('drag-over'); };
        slotDiv.ondrop = (e) => onDropInSlot(e, i);

        binderGrid.appendChild(slotDiv);
      }

      const trayGrid = document.getElementById('tray-grid');
      if (!trayGrid) return;
      trayGrid.innerHTML = '';

      const unplacedCards = collection.filter(item => !binderSlots.includes(item.instanceId));

      unplacedCards.forEach(item => {
        const cardData = cardDatabase.find(c => c.id === item.cardId);
        if (cardData) {
          const cardDiv = document.createElement('div');
          cardDiv.className = 'tray-card';
          cardDiv.draggable = true;
          cardDiv.ondragstart = (e) => onDragStart(e, item.instanceId);
          cardDiv.innerHTML = renderImageHTML(cardData);
          cardDiv.onclick = () => autoPlaceCard(item.instanceId);

          trayGrid.appendChild(cardDiv);
        }
      });
    }

    function onDragStart(e, instanceId) {
      draggedCardInstanceId = instanceId;
      if (e.dataTransfer) {
        e.dataTransfer.setData('text/plain', instanceId);
      }
    }

    function onDropInSlot(e, slotIndex) {
      e.preventDefault();
      document.querySelectorAll('.binder-slot').forEach(s => s.classList.remove('drag-over'));

      if (!draggedCardInstanceId) return;

      const currentSlotIndex = binderSlots.indexOf(draggedCardInstanceId);
      if (currentSlotIndex !== -1) {
        binderSlots[currentSlotIndex] = null;
      }

      binderSlots[slotIndex] = draggedCardInstanceId;
      localStorage.setItem('pkm151_binder_4x4', JSON.stringify(binderSlots));
      draggedCardInstanceId = null;
      renderBinder();
    }

    function autoPlaceCard(instanceId) {
      const openSlotIndex = binderSlots.indexOf(null);
      if (openSlotIndex !== -1) {
        binderSlots[openSlotIndex] = instanceId;
        localStorage.setItem('pkm151_binder_4x4', JSON.stringify(binderSlots));
        renderBinder();
      } else {
        alert("Your 4x4 binder is full!");
      }
    }

    function renderDex() {
      const dexGrid = document.getElementById('dex-grid');
      if (!dexGrid) return;
      dexGrid.innerHTML = '';

      const ownedCardIds = new Set(collection.map(c => c.cardId));

      let totalOwned = 0;
      cardDatabase.forEach(card => {
        const isOwned = ownedCardIds.has(card.id);
        if (isOwned) totalOwned++;

        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${!isOwned ? 'unowned' : ''}`;
        cardDiv.innerHTML = renderImageHTML(card);
        dexGrid.appendChild(cardDiv);
      });

      const header = document.querySelector('#dex-tab h2');
      if (header) {
        header.innerText = `151 Set Collection (${totalOwned}/${cardDatabase.length})`;
      }
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      if (evt && evt.target) {
        evt.target.classList.add('active');
      }
    }

    window.onload = function() {
      renderDex();
      renderBinder();
    };
  </script>
</body>
</html>
