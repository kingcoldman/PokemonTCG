<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG 151 Collector & Pack Simulator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121218;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      user-select: none;
    }

    h1 {
      color: #ffcb05;
      text-shadow: 2px 2px #3b4cca;
      margin-bottom: 5px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background-color: #2a2a38;
      color: #fff;
      border: 2px solid #3b4cca;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #ffcb05;
      color: #121218;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Interactive Pack Swipe Area */
    #pack-container {
      position: relative;
      width: 230px;
      height: 380px;
      margin: 30px auto;
      perspective: 1000px;
    }

    .pack-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    .pack-art {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.7));
    }

    .pack-top-strip {
      position: absolute;
      top: 15px;
      left: 10%;
      width: 80%;
      height: 40px;
      background: rgba(255, 203, 5, 0.4);
      border: 2px dashed #ffcb05;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px #000;
      pointer-events: none;
    }

    /* Stack Reveal Mechanics with Slide to Side */
    #reveal-area {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .card-stack {
      position: relative;
      width: 220px;
      height: 308px;
      margin-bottom: 15px;
    }

    .card-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Animation for sliding to the side */
    .card-item.slide-out {
      transform: translateX(120%) rotate(15deg);
      opacity: 0;
      pointer-events: none;
    }

    /* Grid layout for Binder / Dex */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      width: 140px;
      height: 196px;
      background-color: #2a2a38;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.unowned img { filter: brightness(0.2) grayscale(1); }

    .card-count {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #ffcb05;
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 24px;
      font-size: 12px;
    }

    .status {
      font-size: 16px;
      color: #00d26a;
      margin-top: 10px;
    }

    .next-btn {
      background-color: #ffcb05;
      color: #121218;
      border: none;
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Pokémon 151 TCG Simulator</h1>
  
  <nav>
    <button class="nav-btn active" onclick="switchTab('pack-tab')">Open Pack</button>
    <button class="nav-btn" onclick="switchTab('binder-tab')">My Binder</button>
    <button class="nav-btn" onclick="switchTab('dex-tab')">Card Dex (151)</button>
  </nav>

  <div id="status" class="status">Loading 151 set data...</div>

  <!-- TAB 1: OPEN PACK -->
  <div id="pack-tab" class="tab-content active">
    <div id="pack-container">
      <div id="pack-wrapper" class="pack-wrapper">
        <img class="pack-art" src="https://www.pokemoncenter.com/images/DAMRoot/High/10000/P8976_699-85322_02.jpg" alt="151 Booster Pack">
        <div class="pack-top-strip">Swipe top to rip!</div>
      </div>
    </div>

    <div id="reveal-area">
      <div id="card-stack" class="card-stack"></div>
      <p id="card-counter-text">Tap the card to slide it away!</p>
      <button id="reset-pack-btn" class="next-btn" onclick="resetPackView()" style="display:none;">Open Another Pack</button>
    </div>
  </div>

  <!-- TAB 2: BINDER -->
  <div id="binder-tab" class="tab-content">
    <h2>My Collected Cards</h2>
    <div id="binder-grid" class="card-grid"></div>
  </div>

  <!-- TAB 3: CARD DEX -->
  <div id="dex-tab" class="tab-content">
    <h2>151 Master Set Dex (0/207)</h2>
    <div id="dex-grid" class="card-grid"></div>
  </div>

  <script>
    const SET_ID = 'sv3pt5';
    let cardDatabase = [];
    let collection = JSON.parse(localStorage.getItem('pkm151_collection')) || {};
    let isReady = false;

    let currentPack = [];
    let cardsRemaining = 10;

    let startX = 0;
    let startY = 0;

    let cardPool = {
      common: [],
      uncommon: [],
      rare: [],
      doubleRare: [],
      ultraRare: [],
      illustrationRare: [],
      specialIllustrationRare: [],
      hyperRare: [],
      energy: []
    };

    async function loadSetData() {
      try {
        const response = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${SET_ID}&orderBy=number`);
        const data = await response.json();
        
        cardDatabase = data.data.sort((a, b) => parseInt(a.number) - parseInt(b.number));

        cardDatabase.forEach(card => {
          const rarity = card.rarity ? card.rarity.toLowerCase() : '';
          const supertype = card.supertype ? card.supertype.toLowerCase() : '';

          if (supertype === 'energy') {
            cardPool.energy.push(card);
          } else if (rarity.includes('hyper rare')) {
            cardPool.hyperRare.push(card);
          } else if (rarity.includes('special illustration')) {
            cardPool.specialIllustrationRare.push(card);
          } else if (rarity.includes('ultra rare')) {
            cardPool.ultraRare.push(card);
          } else if (rarity.includes('illustration')) {
            cardPool.illustrationRare.push(card);
          } else if (rarity.includes('double rare')) {
            cardPool.doubleRare.push(card);
          } else if (rarity.includes('uncommon')) {
            cardPool.uncommon.push(card);
          } else if (rarity.includes('common')) {
            cardPool.common.push(card);
          } else {
            cardPool.rare.push(card);
          }
        });

        document.getElementById('status').innerText = "151 Set Ready! Swipe top of booster pack to open.";
        isReady = true;
        setupSwipeEvents();
        renderDex();
        renderBinder();
      } catch (err) {
        document.getElementById('status').innerText = "Error loading set. Please refresh.";
        console.error(err);
      }
    }

    function getRandomCard(pool) {
      if (!pool || pool.length === 0) return cardPool.common[0];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function rollHitSlot() {
      const roll = Math.random() * 100;
      if (roll < 1.94) return getRandomCard(cardPool.hyperRare);
      if (roll < (1.94 + 3.11)) return getRandomCard(cardPool.specialIllustrationRare);
      if (roll < (1.94 + 3.11 + 6.44)) return getRandomCard(cardPool.ultraRare);
      if (roll < (1.94 + 3.11 + 6.44 + 8.50)) return getRandomCard(cardPool.illustrationRare);
      if (roll < (1.94 + 3.11 + 6.44 + 8.50 + 13.28)) return getRandomCard(cardPool.doubleRare);
      return getRandomCard(cardPool.rare);
    }

    function setupSwipeEvents() {
      const pack = document.getElementById('pack-wrapper');

      pack.addEventListener('mousedown', (e) => { startX = e.clientX; startY = e.clientY; });
      pack.addEventListener('mouseup', (e) => { checkSwipe(e.clientX, e.clientY); });

      pack.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      });
      pack.addEventListener('touchend', (e) => {
        checkSwipe(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      });
    }

    function checkSwipe(endX, endY) {
      const diffX = Math.abs(endX - startX);
      const diffY = Math.abs(endY - startY);

      if (diffX > 40 || diffY > 40) {
        tearPack();
      }
    }

    function tearPack() {
      if (!isReady) return;

      document.getElementById('pack-container').style.display = 'none';
      document.getElementById('reveal-area').style.display = 'flex';

      generatePack();
      renderPackStack();
    }

    function generatePack() {
      currentPack = [];

      // Slots 1-4: Common Cards
      for (let i = 0; i < 4; i++) currentPack.push(getRandomCard(cardPool.common));
      
      // Slots 5-7: Uncommon Cards
      for (let i = 0; i < 3; i++) currentPack.push(getRandomCard(cardPool.uncommon));

      // Slot 8: Basic Energy
      currentPack.push(getRandomCard(cardPool.energy));

      // Slot 9: Reverse Holo Slot
      currentPack.push(getRandomCard([...cardPool.common, ...cardPool.uncommon, ...cardPool.rare]));

      // Slot 10: Hit Slot
      currentPack.push(rollHitSlot());

      // Save to local collection
      currentPack.forEach(card => {
        collection[card.id] = (collection[card.id] || 0) + 1;
      });

      localStorage.setItem('pkm151_collection', JSON.stringify(collection));
      renderBinder();
      renderDex();
    }

    function renderPackStack() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      cardsRemaining = 10;
      document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
      document.getElementById('reset-pack-btn').style.display = 'none';

      // Build stack from last card to first card so card 1 is on top
      for (let i = currentPack.length - 1; i >= 0; i--) {
        const card = currentPack[i];
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.style.zIndex = currentPack.length - i;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;

        cardDiv.onclick = function() {
          if (!cardDiv.classList.contains('slide-out')) {
            cardDiv.classList.add('slide-out');
            cardsRemaining--;
            
            if (cardsRemaining > 0) {
              document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
            } else {
              document.getElementById('card-counter-text').innerText = `Pack finished!`;
              document.getElementById('reset-pack-btn').style.display = 'inline-block';
            }
          }
        };

        stack.appendChild(cardDiv);
      }
    }

    function resetPackView() {
      document.getElementById('reveal-area').style.display = 'none';
      document.getElementById('pack-container').style.display = 'block';
    }

    function renderBinder() {
      const binderGrid = document.getElementById('binder-grid');
      binderGrid.innerHTML = '';

      Object.keys(collection).forEach(cardId => {
        const card = cardDatabase.find(c => c.id === cardId);
        if (card) {
          const cardDiv = document.createElement('div');
          cardDiv.className = 'card';
          cardDiv.innerHTML = `
            <img src="${card.images.small}" alt="${card.name}">
            <div class="card-count">x${collection[cardId]}</div>
          `;
          binderGrid.appendChild(cardDiv);
        }
      });
    }

    function renderDex() {
      const dexGrid = document.getElementById('dex-grid');
      dexGrid.innerHTML = '';

      let totalOwned = 0;
      cardDatabase.forEach(card => {
        const count = collection[card.id] || 0;
        if (count > 0) totalOwned++;

        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${count === 0 ? 'unowned' : ''}`;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;
        dexGrid.appendChild(cardDiv);
      });

      document.querySelector('#dex-tab h2').innerText = `151 Master Set Dex (${totalOwned}/${cardDatabase.length})`;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    window.onload = loadSetData;
  </script>
</body>
</html>
