<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG 151 Collector & Pack Simulator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121218;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      user-select: none;
      overflow-x: hidden;
    }

    h1 {
      color: #ffcb05;
      text-shadow: 2px 2px #3b4cca;
      margin-bottom: 5px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background-color: #2a2a38;
      color: #fff;
      border: 2px solid #3b4cca;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #ffcb05;
      color: #121218;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- PACK DISPLAY & ZOOM ANIMATION --- */
    .pack-stage {
      width: 260px;
      height: 440px;
      margin: 10px auto;
      perspective: 800px;
    }

    .pack-frame {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center 20%;
    }

    .pack-frame.zoomed {
      transform: scale(1.8) translateY(80px);
    }

    .pack-art {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.8));
      border-radius: 8px;
    }

    .tear-guide {
      position: absolute;
      top: 55px;
      left: 10%;
      width: 80%;
      height: 35px;
      border: 2px dashed #ffcb05;
      background: rgba(255, 203, 5, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      opacity: 0;
      transition: opacity 0.4s ease;
      cursor: pointer;
      touch-action: none;
    }

    .pack-frame.zoomed .tear-guide {
      opacity: 1;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { border-color: #ffcb05; background: rgba(255, 203, 5, 0.2); }
      to { border-color: #ffffff; background: rgba(255, 255, 255, 0.4); }
    }

    /* --- CARDS REVEAL --- */
    #reveal-area {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .card-stack {
      position: relative;
      width: 220px;
      height: 308px;
      margin-bottom: 15px;
    }

    .card-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-item.slide-out {
      transform: translateX(130%) rotate(20deg);
      opacity: 0;
      pointer-events: none;
    }

    /* --- 4x4 BINDER GRID STYLING --- */
    .binder-container {
      max-width: 680px;
      margin: 0 auto;
      background: #1e1e28;
      border: 4px solid #3b4cca;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .binder-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      justify-items: center;
    }

    .binder-slot {
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      background: #121218;
      border: 2px dashed #444455;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .binder-slot.drag-over {
      border-color: #ffcb05;
      background-color: #2a2a38;
    }

    .binder-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      cursor: grab;
    }

    .slot-number {
      position: absolute;
      font-size: 11px;
      color: #555566;
      pointer-events: none;
    }

    /* Unplaced Cards Area */
    .tray-area {
      margin-top: 25px;
      background: #2a2a38;
      border-radius: 10px;
      padding: 15px;
    }

    .tray-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      min-height: 120px;
      margin-top: 10px;
    }

    .tray-card {
      width: 90px;
      height: 126px;
      border-radius: 6px;
      overflow: hidden;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .tray-card:hover {
      transform: scale(1.05);
    }

    .tray-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- DEX GRID --- */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      width: 130px;
      height: 182px;
      background-color: #2a2a38;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.unowned img { filter: brightness(0.2) grayscale(1); }

    .status {
      font-size: 15px;
      color: #00d26a;
      margin-top: 10px;
    }

    .action-btn {
      background-color: #ffcb05;
      color: #121218;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s;
    }

    .action-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <h1>Pokémon 151 TCG Simulator</h1>
  
  <nav>
    <button class="nav-btn active" onclick="switchTab('pack-tab')">Open Pack</button>
    <button class="nav-btn" onclick="switchTab('binder-tab')">4x4 Binder</button>
    <button class="nav-btn" onclick="switchTab('dex-tab')">Card Dex (151)</button>
  </nav>

  <div id="status" class="status">Loading Pokémon 151 cards...</div>

  <!-- TAB 1: PACK SIMULATOR -->
  <div id="pack-tab" class="tab-content active">
    <div id="pack-container">
      <div class="pack-stage">
        <div id="pack-frame" class="pack-frame">
          <img class="pack-art" id="pack-img" src="https://images.pokemontcg.io/sv3pt5/151_hires.png" alt="151 Mew Pack Art" onerror="this.src='https://assets.pokemon.com/assets/cms2/img/cards/web/SV3PT5/SV3PT5_EN_151.png';">
          <div id="tear-strip" class="tear-guide">Swipe Across Line ➔</div>
        </div>
      </div>
      <button id="zoom-btn" class="action-btn" onclick="prepareToOpen()">Open Pack</button>
    </div>

    <div id="reveal-area">
      <div id="card-stack" class="card-stack"></div>
      <p id="card-counter-text">Tap top card to slide it away!</p>
      <button id="reset-pack-btn" class="action-btn" onclick="resetPackView()" style="display:none;">Open Another Pack</button>
    </div>
  </div>

  <!-- TAB 2: 4x4 CUSTOM BINDER -->
  <div id="binder-tab" class="tab-content">
    <h2>4x4 Interactive Binder</h2>
    <p style="font-size: 14px; color: #aaa;">Drag and drop cards into any slot you like (or tap an unbound card)!</p>
    
    <div class="binder-container">
      <div id="binder-grid" class="binder-4x4"></div>
    </div>

    <div class="tray-area">
      <h3>Unbound Cards</h3>
      <p style="font-size: 12px; color: #888;">Cards you've opened that aren't placed in the binder yet:</p>
      <div id="tray-grid" class="tray-grid"></div>
    </div>
  </div>

  <!-- TAB 3: CARD DEX -->
  <div id="dex-tab" class="tab-content">
    <h2>151 Master Set (0/207)</h2>
    <div id="dex-grid" class="card-grid"></div>
  </div>

  <script>
    const SET_ID = 'sv3pt5';
    let cardDatabase = [];
    let collection = JSON.parse(localStorage.getItem('pkm151_collection')) || [];
    let binderSlots = JSON.parse(localStorage.getItem('pkm151_binder_4x4')) || Array(16).fill(null);
    let isReady = false;

    let currentPack = [];
    let cardsRemaining = 10;
    let startX = 0;
    let draggedCardInstanceId = null;

    let cardPool = {
      common: [], uncommon: [], rare: [], doubleRare: [],
      ultraRare: [], illustrationRare: [], specialIllustrationRare: [],
      hyperRare: [], energy: []
    };

    async function loadSetData() {
      try {
        const response = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${SET_ID}&orderBy=number`);
        const data = await response.json();
        
        if (!data || !data.data) {
          throw new Error("API response error");
        }

        cardDatabase = data.data.sort((a, b) => parseInt(a.number) - parseInt(b.number));

        // Use Mew card as official Mew pack art placeholder
        const mewCard = cardDatabase.find(c => c.name.toLowerCase().includes('mew'));
        if (mewCard && mewCard.images && mewCard.images.large) {
          document.getElementById('pack-img').src = mewCard.images.large;
        }

        cardDatabase.forEach(card => {
          const rarity = card.rarity ? card.rarity.toLowerCase() : '';
          const supertype = card.supertype ? card.supertype.toLowerCase() : '';

          if (supertype === 'energy') cardPool.energy.push(card);
          else if (rarity.includes('hyper rare')) cardPool.hyperRare.push(card);
          else if (rarity.includes('special illustration')) cardPool.specialIllustrationRare.push(card);
          else if (rarity.includes('ultra rare')) cardPool.ultraRare.push(card);
          else if (rarity.includes('illustration')) cardPool.illustrationRare.push(card);
          else if (rarity.includes('double rare')) cardPool.doubleRare.push(card);
          else if (rarity.includes('uncommon')) cardPool.uncommon.push(card);
          else if (rarity.includes('common')) cardPool.common.push(card);
          else cardPool.rare.push(card);
        });

        document.getElementById('status').innerText = "151 Set Ready! Click 'Open Pack' to begin.";
        isReady = true;
        setupTearEvents();
        renderDex();
        renderBinder();
      } catch (err) {
        document.getElementById('status').innerText = "Error loading set data. Please refresh page.";
        console.error(err);
      }
    }

    function prepareToOpen() {
      if (!isReady) {
        alert("Cards are loading, please wait a moment!");
        return;
      }
      document.getElementById('pack-frame').classList.add('zoomed');
      document.getElementById('zoom-btn').style.display = 'none';
      document.getElementById('status').innerText = "Swipe along the dotted line to rip open!";
    }

    function setupTearEvents() {
      const tearStrip = document.getElementById('tear-strip');
      tearStrip.addEventListener('mousedown', (e) => { startX = e.clientX; });
      tearStrip.addEventListener('mouseup', (e) => { checkDrag(e.clientX); });
      tearStrip.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
      tearStrip.addEventListener('touchend', (e) => { checkDrag(e.changedTouches[0].clientX); });
      tearStrip.addEventListener('click', () => { ripPack(); });
    }

    function checkDrag(endX) {
      if (Math.abs(endX - startX) > 20) ripPack();
    }

    function ripPack() {
      document.getElementById('pack-container').style.display = 'none';
      document.getElementById('reveal-area').style.display = 'flex';
      generatePack();
      renderPackStack();
    }

    function getRandomCard(pool) {
      if (!pool || pool.length === 0) return cardPool.common[0] || cardDatabase[0];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function rollHitSlot() {
      const roll = Math.random() * 100;
      if (roll < 1.94) return getRandomCard(cardPool.hyperRare);
      if (roll < 5.05) return getRandomCard(cardPool.specialIllustrationRare);
      if (roll < 11.49) return getRandomCard(cardPool.ultraRare);
      if (roll < 19.99) return getRandomCard(cardPool.illustrationRare);
      if (roll < 33.27) return getRandomCard(cardPool.doubleRare);
      return getRandomCard(cardPool.rare);
    }

    function generatePack() {
      currentPack = [];
      for (let i = 0; i < 4; i++) currentPack.push(getRandomCard(cardPool.common));
      for (let i = 0; i < 3; i++) currentPack.push(getRandomCard(cardPool.uncommon));
      currentPack.push(getRandomCard(cardPool.energy));
      currentPack.push(getRandomCard([...cardPool.common, ...cardPool.uncommon, ...cardPool.rare]));
      currentPack.push(rollHitSlot());

      currentPack.forEach(card => {
        if (card && card.id) {
          collection.push({
            instanceId: 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            cardId: card.id
          });
        }
      });

      localStorage.setItem('pkm151_collection', JSON.stringify(collection));
      renderBinder();
      renderDex();
    }

    function renderPackStack() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      cardsRemaining = 10;
      document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
      document.getElementById('reset-pack-btn').style.display = 'none';

      for (let i = currentPack.length - 1; i >= 0; i--) {
        const card = currentPack[i];
        if (!card) continue;
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.style.zIndex = currentPack.length - i;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;

        cardDiv.onclick = function() {
          if (!cardDiv.classList.contains('slide-out')) {
            cardDiv.classList.add('slide-out');
            cardsRemaining--;
            
            if (cardsRemaining > 0) {
              document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
            } else {
              document.getElementById('card-counter-text').innerText = `Pack finished!`;
              document.getElementById('reset-pack-btn').style.display = 'inline-block';
            }
          }
        };

        stack.appendChild(cardDiv);
      }
    }

    function resetPackView() {
      document.getElementById('pack-frame').classList.remove('zoomed');
      document.getElementById('zoom-btn').style.display = 'inline-block';
      document.getElementById('reveal-area').style.display = 'none';
      document.getElementById('pack-container').style.display = 'block';
      document.getElementById('status').innerText = "151 Set Ready! Click 'Open Pack' to begin.";
    }

    /* --- BINDER DRAG & DROP LOGIC --- */
    function renderBinder() {
      const binderGrid = document.getElementById('binder-grid');
      binderGrid.innerHTML = '';

      for (let i = 0; i < 16; i++) {
        const slotDiv = document.createElement('div');
        slotDiv.className = 'binder-slot';
        slotDiv.dataset.slotIndex = i;

        const boundInstanceId = binderSlots[i];
        const itemInSlot = collection.find(c => c.instanceId === boundInstanceId);

        if (itemInSlot) {
          const cardData = cardDatabase.find(c => c.id === itemInSlot.cardId);
          if (cardData) {
            const img = document.createElement('img');
            img.src = cardData.images.small;
            img.draggable = true;
            img.ondragstart = (e) => onDragStart(e, itemInSlot.instanceId);
            slotDiv.appendChild(img);
          }
        } else {
          slotDiv.innerHTML = `<span class="slot-number">${i + 1}</span>`;
        }

        slotDiv.ondragover = (e) => { e.preventDefault(); slotDiv.classList.add('drag-over'); };
        slotDiv.ondragleave = () => { slotDiv.classList.remove('drag-over'); };
        slotDiv.ondrop = (e) => onDropInSlot(e, i);

        binderGrid.appendChild(slotDiv);
      }

      const trayGrid = document.getElementById('tray-grid');
      trayGrid.innerHTML = '';

      const unplacedCards = collection.filter(item => !binderSlots.includes(item.instanceId));

      unplacedCards.forEach(item => {
        const cardData = cardDatabase.find(c => c.id === item.cardId);
        if (cardData) {
          const cardDiv = document.createElement('div');
          cardDiv.className = 'tray-card';
          cardDiv.draggable = true;
          cardDiv.ondragstart = (e) => onDragStart(e, item.instanceId);
          cardDiv.innerHTML = `<img src="${cardData.images.small}" alt="${cardData.name}">`;
          cardDiv.onclick = () => autoPlaceCard(item.instanceId);

          trayGrid.appendChild(cardDiv);
        }
      });
    }

    function onDragStart(e, instanceId) {
      draggedCardInstanceId = instanceId;
      if (e.dataTransfer) {
        e.dataTransfer.setData('text/plain', instanceId);
      }
    }

    function onDropInSlot(e, slotIndex) {
      e.preventDefault();
      document.querySelectorAll('.binder-slot').forEach(s => s.classList.remove('drag-over'));

      if (!draggedCardInstanceId) return;

      const currentSlotIndex = binderSlots.indexOf(draggedCardInstanceId);
      if (currentSlotIndex !== -1) {
        binderSlots[currentSlotIndex] = null;
      }

      binderSlots[slotIndex] = draggedCardInstanceId;
      localStorage.setItem('pkm151_binder_4x4', JSON.stringify(binderSlots));
      draggedCardInstanceId = null;
      renderBinder();
    }

    function autoPlaceCard(instanceId) {
      const openSlotIndex = binderSlots.indexOf(null);
      if (openSlotIndex !== -1) {
        binderSlots[openSlotIndex] = instanceId;
        localStorage.setItem('pkm151_binder_4x4', JSON.stringify(binderSlots));
        renderBinder();
      } else {
        alert("Your 4x4 binder is full!");
      }
    }

    function renderDex() {
      const dexGrid = document.getElementById('dex-grid');
      dexGrid.innerHTML = '';

      const ownedCardIds = new Set(collection.map(c => c.cardId));

      let totalOwned = 0;
      cardDatabase.forEach(card => {
        const isOwned = ownedCardIds.has(card.id);
        if (isOwned) totalOwned++;

        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${!isOwned ? 'unowned' : ''}`;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;
        dexGrid.appendChild(cardDiv);
      });

      document.querySelector('#dex-tab h2').innerText = `151 Master Set (${totalOwned}/${cardDatabase.length})`;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    window.onload = loadSetData;
  </script>
</body>
</html>
