<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon TCG Pocket: 151 Edition</title>
  <style>
    :root {
      --bg-dark: #1e1e24;
      --card-width: 110px;
      --card-height: 154px;
      --fire-color: #ff6b6b;
      --water-color: #4ecdc4;
      --grass-color: #51cf66;
      --electric-color: #fcc419;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0f1016;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Top Stats Bar */
    header {
      width: 100%;
      max-width: 900px;
      background: #181920;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }

    .score-box {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Main Battle Arena */
    #battlefield {
      width: 100%;
      max-width: 900px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      gap: 15px;
      background: radial-gradient(circle, #1a1c29 0%, #0c0d12 100%);
    }

    .player-zone {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bench-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      min-height: calc(var(--card-height) + 10px);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 5px;
      border: 1px dashed #444;
    }

    .active-row {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(var(--card-height) + 20px);
    }

    /* Card Styling */
    .card {
      width: var(--card-width);
      height: var(--card-height);
      background: #2a2d3d;
      border-radius: 8px;
      border: 2px solid #555;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card.selected {
      border-color: #fcc419;
      box-shadow: 0 0 12px #fcc419;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .card-title {
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-hp {
      color: #ff6b6b;
    }

    .card-art {
      width: 100%;
      height: 60px;
      background-size: cover;
      background-position: center;
      border-radius: 4px;
      background-color: #111;
    }

    .card-body {
      font-size: 0.65rem;
      text-align: center;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 4px;
    }

    .energy-badges {
      display: flex;
      gap: 2px;
      margin-top: 2px;
      justify-content: center;
    }

    .badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .fire { background: var(--fire-color); }
    .water { background: var(--water-color); }
    .grass { background: var(--grass-color); }
    .electric { background: var(--electric-color); }

    /* Action Toolbar & Hand */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    button {
      background: #3b5bdb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4c6ef5;
    }

    button:disabled {
      background: #444;
      cursor: not-allowed;
    }

    #hand {
      display: flex;
      justify-content: center;
      gap: 10px;
      overflow-x: auto;
      padding: 10px;
      min-height: calc(var(--card-height) + 20px);
      background: #14151d;
      border-top: 1px solid #333;
      width: 100%;
      max-width: 900px;
    }

    /* Modal / Alert Overlay */
    #log-zone {
      background: #111;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      height: 50px;
      overflow-y: auto;
      color: #aaa;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <header>
    <h2>Pokémon TCG Pocket (Set 151)</h2>
    <div class="score-box">
      <span>You: <span id="player-score">0</span>/3 Points</span>
      <span>Opponent: <span id="ai-score">0</span>/3 Points</span>
    </div>
  </header>

  <div id="battlefield">
    <!-- AI Field -->
    <div class="player-zone">
      <small style="color: #aaa;">OPPONENT BENCH</small>
      <div id="ai-bench" class="bench-row"></div>
      <div id="ai-active" class="active-row"></div>
    </div>

    <!-- Battle Log -->
    <div id="log-zone">Welcome to Pokémon TCG Pocket (Set 151)! Tap 'Attach Energy' and 'Attack' to battle.</div>

    <!-- Player Field -->
    <div class="player-zone">
      <div id="player-active" class="active-row"></div>
      <small style="color: #aaa;">YOUR BENCH (Max 3)</small>
      <div id="player-bench" class="bench-row"></div>
    </div>
  </div>

  <!-- Command Buttons -->
  <div class="controls">
    <button id="attach-btn" onclick="attachEnergy()">Attach Turn Energy (+1)</button>
    <button id="attack-btn" onclick="playerAttack()">Attack!</button>
    <button id="end-turn-btn" onclick="endTurn()">End Turn</button>
  </div>

  <!-- Player Hand -->
  <div id="hand"></div>

  <script>
    // --- SET 151 CARD DATABASE ---
    const CARD_SET_151 = [
      { id: 1, name: "Bulbasaur", hp: 70, type: "grass", energyCost: 1, damage: 20, attackName: "Vine Whip", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" },
      { id: 4, name: "Charmander", hp: 60, type: "fire", energyCost: 1, damage: 20, attackName: "Ember", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" },
      { id: 7, name: "Squirtle", hp: 60, type: "water", energyCost: 1, damage: 20, attackName: "Water Gun", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" },
      { id: 25, name: "Pikachu", hp: 60, type: "electric", energyCost: 1, damage: 30, attackName: "Thunder Shock", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" },
      { id: 6, name: "Charizard ex", hp: 180, type: "fire", energyCost: 2, damage: 80, attackName: "Slash", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" },
      { id: 9, name: "Blastoise ex", hp: 180, type: "water", energyCost: 2, damage: 80, attackName: "Hydro Pump", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png" },
      { id: 3, name: "Venusaur ex", hp: 190, type: "grass", energyCost: 2, damage: 70, attackName: "Giant Bloom", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png" },
      { id: 150, name: "Mewtwo ex", hp: 150, type: "electric", energyCost: 2, damage: 60, attackName: "Psystrike", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png" }
    ];

    // --- GAME STATE ---
    let player = { hand: [], bench: [], active: null, score: 0, attachedEnergyThisTurn: false };
    let ai = { hand: [], bench: [], active: null, score: 0 };
    let selectedCardIndex = null;
    let isPlayerTurn = true;

    // --- HELPER FUNCTIONS ---
    function log(msg) {
      const logZone = document.getElementById("log-zone");
      logZone.innerHTML += `<br>${msg}`;
      logZone.scrollTop = logZone.scrollHeight;
    }

    function createCardInstance(template) {
      return { ...template, currentHp: template.hp, attachedEnergy: 0, uid: Math.random() };
    }

    function drawCard(target) {
      const randomCard = CARD_SET_151[Math.floor(Math.random() * CARD_SET_151.length)];
      target.hand.push(createCardInstance(randomCard));
    }

    // --- INITIALIZATION ---
    function initGame() {
      // Draw 3 initial cards each
      for (let i = 0; i < 3; i++) {
        drawCard(player);
        drawCard(ai);
      }
      
      // Auto-assign Active for AI
      ai.active = ai.hand.pop();
      
      render();
      log("Game started! Play a Pokémon to your active spot from your hand.");
    }

    // --- RENDER GAME BOARD ---
    function render() {
      // Scores
      document.getElementById("player-score").innerText = player.score;
      document.getElementById("ai-score").innerText = ai.score;

      // Render Player Hand
      const handEl = document.getElementById("hand");
      handEl.innerHTML = "";
      player.hand.forEach((card, idx) => {
        handEl.appendChild(createCardUI(card, () => selectHandCard(idx), idx === selectedCardIndex));
      });

      // Render Player Active
      const pActiveEl = document.getElementById("player-active");
      pActiveEl.innerHTML = "";
      if (player.active) {
        pActiveEl.appendChild(createCardUI(player.active));
      } else {
        pActiveEl.innerHTML = `<div style="color: #666; border: 2px dashed #444; padding: 20px; border-radius: 8px;">Play Active Pokémon</div>`;
      }

      // Render Player Bench
      const pBenchEl = document.getElementById("player-bench");
      pBenchEl.innerHTML = "";
      player.bench.forEach(card => pBenchEl.appendChild(createCardUI(card)));

      // Render AI Active
      const aiActiveEl = document.getElementById("ai-active");
      aiActiveEl.innerHTML = "";
      if (ai.active) {
        aiActiveEl.appendChild(createCardUI(ai.active));
      }

      // Render AI Bench
      const aiBenchEl = document.getElementById("ai-bench");
      aiBenchEl.innerHTML = "";
      ai.bench.forEach(card => aiBenchEl.appendChild(createCardUI(card)));

      // Control States
      document.getElementById("attach-btn").disabled = !isPlayerTurn || player.attachedEnergyThisTurn || !player.active;
      document.getElementById("attack-btn").disabled = !isPlayerTurn || !player.active || player.active.attachedEnergy < player.active.energyCost;
    }

    function createCardUI(card, onClick, isSelected = false) {
      const cardDiv = document.createElement("div");
      cardDiv.className = `card ${isSelected ? 'selected' : ''}`;
      if (onClick) cardDiv.onclick = onClick;

      cardDiv.innerHTML = `
        <div class="card-header">
          <span class="card-title">${card.name}</span>
          <span class="card-hp">${card.currentHp}/${card.hp}</span>
        </div>
        <div class="card-art" style="background-image: url('${card.image}')"></div>
        <div class="card-body">
          <div><strong>${card.attackName}</strong> (${card.damage})</div>
          <div class="energy-badges">
            ${'<span class="badge ' + card.type + '"></span>'.repeat(card.attachedEnergy)}
          </div>
        </div>
      `;
      return cardDiv;
    }

    // --- USER INTERACTIONS ---
    function selectHandCard(index) {
      if (!isPlayerTurn) return;

      if (!player.active) {
        // First card played becomes Active
        player.active = player.hand.splice(index, 1)[0];
        log(`You sent out <strong>${player.active.name}</strong> as your Active Pokémon!`);
      } else if (player.bench.length < 3) {
        // Subsequent cards go to Bench
        const benched = player.hand.splice(index, 1)[0];
        player.bench.push(benched);
        log(`You placed <strong>${benched.name}</strong> on your Bench.`);
      } else {
        log("Bench is full!");
      }
      selectedCardIndex = null;
      render();
    }

    function attachEnergy() {
      if (player.active && !player.attachedEnergyThisTurn) {
        player.active.attachedEnergy += 1;
        player.attachedEnergyThisTurn = true;
        log(`Attached Energy to <strong>${player.active.name}</strong>.`);
        render();
      }
    }

    function playerAttack() {
      if (!player.active || !ai.active) return;

      log(`Your <strong>${player.active.name}</strong> used <strong>${player.active.attackName}</strong> for ${player.active.damage} damage!`);
      ai.active.currentHp -= player.active.damage;

      if (ai.active.currentHp <= 0) {
        log(`Opponent's <strong>${ai.active.name}</strong> was knocked out! You gain 1 Point!`);
        player.score += 1;
        ai.active = ai.bench.pop() || null;

        if (player.score >= 3) {
          alert("🎉 YOU WIN THE MATCH!");
          location.reload();
          return;
        }
      }

      endTurn();
    }

    function endTurn() {
      isPlayerTurn = false;
      player.attachedEnergyThisTurn = false;
      log("<strong>--- Opponent's Turn ---</strong>");
      
      setTimeout(aiTurn, 1200);
    }

    // --- AI LOGIC ---
    function aiTurn() {
      // 1. Draw card
      drawCard(ai);

      // 2. Play card to Bench if available
      if (ai.hand.length > 0 && ai.bench.length < 3) {
        ai.bench.push(ai.hand.pop());
      }

      // 3. Attach energy
      if (ai.active) {
        ai.active.attachedEnergy += 1;
      }

      // 4. Attack if possible
      if (ai.active && ai.active.attachedEnergy >= ai.active.energyCost && player.active) {
        log(`Opponent's <strong>${ai.active.name}</strong> used <strong>${ai.active.attackName}</strong> dealing ${ai.active.damage} damage!`);
        player.active.currentHp -= ai.active.damage;

        if (player.active.currentHp <= 0) {
          log(`Your <strong>${player.active.name}</strong> was knocked out! Opponent gains 1 Point!`);
          ai.score += 1;
          player.active = player.bench.pop() || null;

          if (ai.score >= 3) {
            alert("❌ GAME OVER - Opponent Won!");
            location.reload();
            return;
          }
        }
      }

      // Start Player Turn
      isPlayerTurn = true;
      drawCard(player);
      log("<strong>--- Your Turn ---</strong>");
      render();
    }

    // Start
    initGame();
  </script>
</body>
</html>
