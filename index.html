<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon 151 Pocket Pack Opening</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #ffcb05;
      --accent-blue: #2a75bb;
      --text-color: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background: #1f242d;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent-color);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Main Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .tab-content {
      display: none;
      height: 100%;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Packs View */
    .pack-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
    }

    .pack-wrapper {
      width: 220px;
      height: 340px;
      background: linear-gradient(135deg, #cc0000 0%, #ff5959 50%, #cc0000 100%);
      border-radius: 12px;
      border: 4px solid var(--accent-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 15px rgba(255, 203, 5, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .pack-wrapper:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 25px rgba(255, 203, 5, 0.7);
    }

    .pack-title {
      font-weight: 900;
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
    }

    .pack-art {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #fff 0%, #ffcb05 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .pack-art img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .pack-subtitle {
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .pack-stats {
      text-align: center;
      background: var(--card-bg);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }

    .pack-count {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .timer {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
    }

    .btn {
      background: linear-gradient(180deg, var(--accent-color) 0%, #e6b800 100%);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(255, 203, 5, 0.4);
    }

    .btn:disabled {
      background: #484f58;
      color: #8b949e;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Pokédex View */
    .pokedex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1000px;
      padding-bottom: 80px;
    }

    .pokedex-card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid #30363d;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease;
    }

    .pokedex-card:hover {
      transform: scale(1.05);
      z-index: 2;
    }

    .pokedex-card img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      filter: grayscale(100%) brightness(0.2);
      transition: filter 0.3s ease;
    }

    .pokedex-card.owned img {
      filter: grayscale(0%) brightness(1);
    }

    .pokedex-card .card-num {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    .pokedex-card .card-name {
      font-size: 0.75rem;
      margin-top: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Opening Overlay (Pokémon TCGP Style) */
    .opening-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 7, 10, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .opening-overlay.active {
      display: flex;
      opacity: 1;
    }

    .rip-pack-container {
      position: relative;
      width: 260px;
      height: 400px;
      cursor: pointer;
    }

    .pack-rip-top {
      position: absolute;
      top: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(135deg, #cc0000 0%, #ff5959 100%);
      border-radius: 12px 12px 0 0;
      border: 4px solid var(--accent-color);
      border-bottom: 2px dashed #000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      z-index: 2;
    }

    .pack-rip-bottom {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 330px;
      background: linear-gradient(135deg, #a00000 0%, #cc0000 100%);
      border-radius: 0 0 12px 12px;
      border: 4px solid var(--accent-color);
      border-top: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .rip-instruction {
      color: #fff;
      font-weight: bold;
      margin-top: 20px;
      text-align: center;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.5; transform: scale(0.98); }
    }

    .ripped .pack-rip-top {
      transform: translateY(-80px) rotate(-15deg);
      opacity: 0;
    }

    /* Revealed Cards Stage */
    .cards-stage {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
    }

    .revealed-card {
      width: 140px;
      height: 195px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .revealed-card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }

    .card-back {
      background: #1e232a;
      border: 2px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back::after {
      content: "Pokémon";
      color: var(--accent-color);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .card-front {
      transform: rotateY(180deg);
      background-size: cover;
      background-position: center;
      border: 2px solid #fff;
    }

    .card-front.rare {
      box-shadow: 0 0 15px rgba(255, 203, 5, 0.8);
      border-color: var(--accent-color);
    }

    .close-btn {
      margin-top: 20px;
      display: none;
    }

    /* Hotbar Navigation */
    nav.hotbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      width: 33%;
      transition: color 0.2s ease;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pokémon 151 Card Pocket</h1>
  </header>

  <main>
    <!-- Tab 1: Packs -->
    <div id="tab-packs" class="tab-content active">
      <div class="pack-container">
        <div class="pack-wrapper" id="pack-graphic">
          <div class="pack-title">151</div>
          <div class="pack-art">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" alt="Charizard">
          </div>
          <div class="pack-subtitle">SCARLET & VIOLET</div>
        </div>

        <div class="pack-stats">
          <div class="pack-count">Available Packs: <span id="pack-qty">1</span>/10</div>
          <div class="timer" id="timer-text">Next pack in: 59m 59s</div>
        </div>

        <div class="action-buttons">
          <button class="btn" id="btn-open-1" onclick="startOpening(1)">Open 1</button>
          <button class="btn" id="btn-open-10" onclick="startOpening(10)">Open 10</button>
        </div>
      </div>
    </div>

    <!-- Tab 2: Pokédex -->
    <div id="tab-pokedex" class="tab-content">
      <div class="pokedex-grid" id="pokedex-grid"></div>
    </div>
  </main>

  <!-- Opening Scene Animation Overlay -->
  <div class="opening-overlay" id="opening-overlay">
    <div class="rip-pack-container" id="rip-container" onclick="ripPack()">
      <div class="pack-rip-top"></div>
      <div class="pack-rip-bottom">
        <div class="pack-title" style="color:#fff;">151</div>
      </div>
    </div>
    <div class="rip-instruction" id="rip-instruction">Click Pack to Rip Open!</div>

    <div class="cards-stage" id="cards-stage"></div>
    <button class="btn close-btn" id="btn-collect" onclick="closeOpening()">Collect Cards</button>
  </div>

  <!-- Hotbar Navigation -->
  <nav class="hotbar">
    <div class="nav-item active" onclick="switchTab('packs', this)">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16zM6 6h12v4H6zm0 6h12v6H6z"/></svg>
      Packs
    </div>
    <div class="nav-item" onclick="switchTab('pokedex', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
      Pokédex
    </div>
  </nav>

  <script>
    // Real-life SV 151 Pokemon Set baseline array
    const POKEMON_151 = [
      { id: 1, name: "Bulbasaur", rarity: "Common" },
      { id: 2, name: "Ivysaur", rarity: "Uncommon" },
      { id: 3, name: "Venusaur EX", rarity: "Double Rare" },
      { id: 4, name: "Charmander", rarity: "Common" },
      { id: 5, name: "Charmeleon", rarity: "Uncommon" },
      { id: 6, name: "Charizard EX", rarity: "Double Rare" },
      { id: 7, name: "Squirtle", rarity: "Common" },
      { id: 8, name: "Wartortle", rarity: "Uncommon" },
      { id: 9, name: "Blastoise EX", rarity: "Double Rare" },
      { id: 10, name: "Caterpie", rarity: "Common" },
      { id: 11, name: "Metapod", rarity: "Common" },
      { id: 12, name: "Butterfree", rarity: "Uncommon" },
      { id: 13, name: "Weedle", rarity: "Common" },
      { id: 14, name: "Kakuna", rarity: "Common" },
      { id: 15, name: "Beedrill", rarity: "Uncommon" },
      { id: 16, name: "Pidgey", rarity: "Common" },
      { id: 17, name: "Pidgeotto", rarity: "Common" },
      { id: 18, name: "Pidgeot EX", rarity: "Double Rare" },
      { id: 19, name: "Rattata", rarity: "Common" },
      { id: 20, name: "Raticate", rarity: "Common" },
      { id: 25, name: "Pikachu", rarity: "Common" },
      { id: 26, name: "Raichu", rarity: "Uncommon" },
      { id: 39, name: "Jigglypuff", rarity: "Common" },
      { id: 40, name: "Wigglytuff EX", rarity: "Double Rare" },
      { id: 52, name: "Meowth", rarity: "Common" },
      { id: 54, name: "Psyduck", rarity: "Common" },
      { id: 59, name: "Arcanine", rarity: "Uncommon" },
      { id: 65, name: "Alakazam EX", rarity: "Double Rare" },
      { id: 94, name: "Gengar", rarity: "Rare" },
      { id: 129, name: "Magikarp", rarity: "Common" },
      { id: 130, name: "Gyarados", rarity: "Rare" },
      { id: 131, name: "Lapras", rarity: "Rare" },
      { id: 132, name: "Ditto", rarity: "Rare" },
      { id: 133, name: "Eevee", rarity: "Common" },
      { id: 134, name: "Vaporeon", rarity: "Rare" },
      { id: 135, name: "Jolteon", rarity: "Rare" },
      { id: 136, name: "Flareon", rarity: "Rare" },
      { id: 143, name: "Snorlax", rarity: "Rare" },
      { id: 144, name: "Articuno", rarity: "Rare" },
      { id: 145, name: "Zapdos EX", rarity: "Double Rare" },
      { id: 146, name: "Moltres", rarity: "Rare" },
      { id: 147, name: "Dratini", rarity: "Common" },
      { id: 148, name: "Dragonair", rarity: "Uncommon" },
      { id: 149, name: "Dragonite", rarity: "Rare" },
      { id: 150, name: "Mewtwo", rarity: "Rare" },
      { id: 151, name: "Mew EX", rarity: "Ultra Rare" }
    ];

    // Helper to fill remaining set items dynamically if missing from standard 151
    for (let i = 1; i <= 151; i++) {
      if (!POKEMON_151.some(p => p.id === i)) {
        POKEMON_151.push({ id: i, name: `Pokémon #${i}`, rarity: i % 5 === 0 ? "Uncommon" : "Common" });
      }
    }
    POKEMON_151.sort((a, b) => a.id - b.id);

    // Game State
    let state = {
      packs: 1,
      maxPacks: 10,
      nextPackTime: Date.now() + 3600000,
      ownedCards: new Set(),
      pendingOpeningCount: 0,
      cardsToFlip: []
    };

    // Load Game State
    function loadState() {
      const saved = localStorage.getItem('poke_151_save');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.packs = parsed.packs;
        state.nextPackTime = parsed.nextPackTime;
        state.ownedCards = new Set(parsed.ownedCards);
      }
      checkTimer();
    }

    // Save Game State
    function saveState() {
      localStorage.setItem('poke_151_save', JSON.stringify({
        packs: state.packs,
        nextPackTime: state.nextPackTime,
        ownedCards: Array.from(state.ownedCards)
      }));
    }

    // Timer Loop
    function checkTimer() {
      const now = Date.now();
      if (now >= state.nextPackTime) {
        if (state.packs < state.maxPacks) {
          const addedPacks = Math.floor((now - state.nextPackTime) / 3600000) + 1;
          state.packs = Math.min(state.maxPacks, state.packs + addedPacks);
          state.nextPackTime = now + 3600000;
        }
      }
      updateUI();
    }
    setInterval(checkTimer, 1000);

    // Update UI Elements
    function updateUI() {
      document.getElementById('pack-qty').innerText = state.packs;
      
      const btn1 = document.getElementById('btn-open-1');
      const btn10 = document.getElementById('btn-open-10');
      
      btn1.disabled = state.packs < 1;
      btn10.disabled = state.packs < 10;

      if (state.packs >= state.maxPacks) {
        document.getElementById('timer-text').innerText = "Pack Stack Full!";
      } else {
        const diff = Math.max(0, state.nextPackTime - Date.now());
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        document.getElementById('timer-text').innerText = `Next pack in: ${mins}m ${secs}s`;
      }
    }

    // Navigation Switch
    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      el.classList.add('active');

      if (tabName === 'pokedex') renderPokedex();
    }

    // Render Pokédex Grid
    function renderPokedex() {
      const grid = document.getElementById('pokedex-grid');
      grid.innerHTML = '';

      POKEMON_151.forEach(card => {
        const isOwned = state.ownedCards.has(card.id);
        const cardEl = document.createElement('div');
        cardEl.className = `pokedex-card ${isOwned ? 'owned' : ''}`;
        
        // Official artwork URL
        const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${card.id}.png`;

        cardEl.innerHTML = `
          <span class="card-num">#${String(card.id).padStart(3, '0')}</span>
          <img src="${imgUrl}" alt="${card.name}">
          <div class="card-name">${isOwned ? card.name : '???'}</div>
        `;
        grid.appendChild(cardEl);
      });
    }

    // Pull Rates Engine
    function getRandomCard() {
      const rand = Math.random() * 100;
      let rarity = "Common";
      
      if (rand < 2) rarity = "Ultra Rare";
      else if (rand < 10) rarity = "Double Rare";
      else if (rand < 25) rarity = "Rare";
      else if (rand < 55) rarity = "Uncommon";

      const matching = POKEMON_151.filter(c => c.rarity === rarity);
      if (matching.length === 0) return POKEMON_151[Math.floor(Math.random() * POKEMON_151.length)];
      return matching[Math.floor(Math.random() * matching.length)];
    }

    // Start Opening Sequence
    function startOpening(count) {
      if (state.packs < count) return;
      state.packs -= count;
      state.pendingOpeningCount = count;
      saveState();
      updateUI();

      // Generate Cards (5 cards per pack)
      state.cardsToFlip = [];
      for (let p = 0; p < count; p++) {
        for (let c = 0; c < 5; c++) {
          state.cardsToFlip.push(getRandomCard());
        }
      }

      // Show Rip Stage
      const overlay = document.getElementById('opening-overlay');
      const ripContainer = document.getElementById('rip-container');
      const cardsStage = document.getElementById('cards-stage');
      
      ripContainer.classList.remove('ripped');
      ripContainer.style.display = 'block';
      document.getElementById('rip-instruction').style.display = 'block';
      document.getElementById('btn-collect').style.display = 'none';
      cardsStage.innerHTML = '';
      
      overlay.classList.add('active');
    }

    // Rip Pack Animation
    function ripPack() {
      const ripContainer = document.getElementById('rip-container');
      if (ripContainer.classList.contains('ripped')) return;

      ripContainer.classList.add('ripped');
      document.getElementById('rip-instruction').style.display = 'none';

      setTimeout(() => {
        ripContainer.style.display = 'none';
        revealCardsStage();
      }, 600);
    }

    // Render Cards to Flip Stage
    function revealCardsStage() {
      const stage = document.getElementById('cards-stage');
      stage.innerHTML = '';

      state.cardsToFlip.forEach((card) => {
        state.ownedCards.add(card.id); // Add to pokedex

        const cardEl = document.createElement('div');
        cardEl.className = 'revealed-card';
        const isRare = card.rarity === 'Double Rare' || card.rarity === 'Ultra Rare';
        
        const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${card.id}.png`;

        cardEl.innerHTML = `
          <div class="card-inner">
            <div class="card-back"></div>
            <div class="card-front ${isRare ? 'rare' : ''}" style="background-image: radial-gradient(circle, #fff 0%, #edf2f7 100%);">
              <img src="${imgUrl}" style="width:100%; height:80%; object-fit:contain; margin-top:5px;">
              <div style="color:#000; font-size:0.75rem; font-weight:bold; margin-top:2px;">${card.name}</div>
            </div>
          </div>
        `;

        cardEl.onclick = () => {
          cardEl.classList.add('flipped');
          checkAllFlipped();
        };

        stage.appendChild(cardEl);
      });

      saveState();
    }

    function checkAllFlipped() {
      const allCards = document.querySelectorAll('.revealed-card');
      const allFlipped = Array.from(allCards).every(c => c.classList.contains('flipped'));
      if (allFlipped) {
        document.getElementById('btn-collect').style.display = 'inline-block';
      }
    }

    function closeOpening() {
      document.getElementById('opening-overlay').classList.remove('active');
    }

    // Initialize
    loadState();
  </script>
