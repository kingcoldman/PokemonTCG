<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG 151 Pack Opener</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a24;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #ffcb05;
      text-shadow: 2px 2px #3b4cca;
      margin-bottom: 10px;
    }

    p {
      color: #a0a0b0;
      margin-bottom: 20px;
    }

    button {
      background-color: #ffcb05;
      color: #1a1a24;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background-color: #ffe169;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    #card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
      min-height: 300px;
    }

    .card {
      width: 150px;
      height: 210px;
      background-color: #2a2a38;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s;
      border: 2px solid #3b4cca;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status {
      font-size: 18px;
      margin-top: 20px;
      color: #00d26a;
    }
  </style>
</head>
<body>

  <h1>151 Booster Pack Opener</h1>
  <p>Open a pack with real-life drop rates and card artwork!</p>
  
  <button id="open-btn" onclick="openPack()">Open 151 Pack</button>
  
  <div id="status" class="status"></div>
  <div id="card-container"></div>

  <script>
    // Set 151 Cards separated by real-world rarity categories
    // Base set ID for Scarlet & Violet 151 is 'sv3pt5'
    let cardPool = {
      common: [],
      uncommon: [],
      rare: [],
      doubleRare: [],
      ultraRare: [],
      illustrationRare: [],
      specialIllustrationRare: [],
      hyperRare: [],
      energy: []
    };

    let isLoaded = false;

    // Fetch card details directly from Pokemon TCG API for set 151 (sv3pt5)
    async function load151Cards() {
      const statusText = document.getElementById('status');
      statusText.innerText = "Loading 151 card set data...";
      document.getElementById('open-btn').disabled = true;

      try {
        const response = await fetch('https://api.pokemontcg.io/v2/cards?q=set.id:sv3pt5');
        const data = await response.json();
        const cards = data.data;

        // Categorize cards by rarity
        cards.forEach(card => {
          const rarity = card.rarity ? card.rarity.toLowerCase() : '';
          const supertype = card.supertype ? card.supertype.toLowerCase() : '';

          if (supertype === 'energy') {
            cardPool.energy.push(card);
          } else if (rarity.includes('common') && !rarity.includes('uncommon')) {
            cardPool.common.push(card);
          } else if (rarity.includes('uncommon')) {
            cardPool.uncommon.push(card);
          } else if (rarity.includes('double rare')) {
            cardPool.doubleRare.push(card);
          } else if (rarity.includes('ultra rare')) {
            cardPool.ultraRare.push(card);
          } else if (rarity.includes('special illustration')) {
            cardPool.specialIllustrationRare.push(card);
          } else if (rarity.includes('illustration')) {
            cardPool.illustrationRare.push(card);
          } else if (rarity.includes('hyper rare')) {
            cardPool.hyperRare.push(card);
          } else {
            cardPool.rare.push(card);
          }
        });

        statusText.innerText = "Set loaded! Click the button to open your pack.";
        document.getElementById('open-btn').disabled = false;
        isLoaded = true;
      } catch (error) {
        statusText.innerText = "Failed to load cards. Please refresh the page.";
        console.error("Error loading cards:", error);
      }
    }

    // Helper to get a random card from a pool
    function getRandomCard(pool) {
      if (!pool || pool.length === 0) return cardPool.common[0]; // Fallback
      const randomIndex = Math.floor(Math.random() * pool.length);
      return pool[randomIndex];
    }

    // Roll real-life slot 10 rare odds
    function getHitSlot() {
      const roll = Math.random() * 100;

      // Real-life approximate 151 pull rates per pack:
      if (roll < 1) return getRandomCard(cardPool.hyperRare);             // ~1%
      if (roll < 4) return getRandomCard(cardPool.specialIllustrationRare); // ~3%
      if (roll < 10) return getRandomCard(cardPool.illustrationRare);     // ~6%
      if (roll < 18) return getRandomCard(cardPool.ultraRare);            // ~8%
      if (roll < 33) return getRandomCard(cardPool.doubleRare);           // ~15%
      return getRandomCard(cardPool.rare);                                // ~67% Holo Rare
    }

    // Generate a full 10-card booster pack
    function openPack() {
      if (!isLoaded) return;

      const container = document.getElementById('card-container');
      container.innerHTML = '';
      document.getElementById('status').innerText = "Opening pack...";

      let pack = [];

      // Slots 1-4: Commons
      for (let i = 0; i < 4; i++) pack.push(getRandomCard(cardPool.common));

      // Slots 5-7: Uncommons
      for (let i = 0; i < 3; i++) pack.push(getRandomCard(cardPool.uncommon));

      // Slot 8: Energy
      pack.push(getRandomCard(cardPool.energy.length > 0 ? cardPool.energy : cardPool.common));

      // Slot 9: Reverse Holo (Simulated using common/uncommon/rare pool)
      pack.push(getRandomCard([...cardPool.common, ...cardPool.uncommon, ...cardPool.rare]));

      // Slot 10: Rare / Hit Slot
      pack.push(getHitSlot());

      // Display cards
      pack.forEach(card => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;
        container.appendChild(cardDiv);
      });

      document.getElementById('status').innerText = "Pack Opened!";
    }

    // Load the 151 set automatically when the page loads
    window.onload = load151Cards;
  </script>
</body>
</html>
