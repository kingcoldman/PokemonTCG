<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG 151 Collector & Pack Simulator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121218;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      user-select: none;
      overflow-x: hidden;
    }

    h1 {
      color: #ffcb05;
      text-shadow: 2px 2px #3b4cca;
      margin-bottom: 5px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background-color: #2a2a38;
      color: #fff;
      border: 2px solid #3b4cca;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #ffcb05;
      color: #121218;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- PACK DISPLAY & ZOOM ANIMATION --- */
    .pack-stage {
      width: 260px;
      height: 440px;
      margin: 10px auto;
      perspective: 800px;
    }

    .pack-frame {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center 20%;
    }

    /* Zoom mode when opening */
    .pack-frame.zoomed {
      transform: scale(1.8) translateY(80px);
    }

    .pack-art {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.8));
    }

    /* Tear Strip Overlay */
    .tear-guide {
      position: absolute;
      top: 55px;
      left: 10%;
      width: 80%;
      height: 35px;
      border: 2px dashed #ffcb05;
      background: rgba(255, 203, 5, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      opacity: 0;
      transition: opacity 0.4s ease;
      cursor: pointer;
      touch-action: none;
    }

    .pack-frame.zoomed .tear-guide {
      opacity: 1;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { border-color: #ffcb05; background: rgba(255, 203, 5, 0.2); }
      to { border-color: #ffffff; background: rgba(255, 255, 255, 0.4); }
    }

    /* --- CARDS REVEAL --- */
    #reveal-area {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .card-stack {
      position: relative;
      width: 220px;
      height: 308px;
      margin-bottom: 15px;
    }

    .card-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-item.slide-out {
      transform: translateX(130%) rotate(20deg);
      opacity: 0;
      pointer-events: none;
    }

    /* --- BINDER & DEX GRID --- */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      width: 130px;
      height: 182px;
      background-color: #2a2a38;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.unowned img { filter: brightness(0.2) grayscale(1); }

    .card-count {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #ffcb05;
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 24px;
      font-size: 12px;
    }

    .status {
      font-size: 15px;
      color: #00d26a;
      margin-top: 10px;
    }

    .action-btn {
      background-color: #ffcb05;
      color: #121218;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s;
    }

    .action-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <h1>Pokémon 151 TCG Simulator</h1>
  
  <nav>
    <button class="nav-btn active" onclick="switchTab('pack-tab')">Open Pack</button>
    <button class="nav-btn" onclick="switchTab('binder-tab')">My Binder</button>
    <button class="nav-btn" onclick="switchTab('dex-tab')">Card Dex (151)</button>
  </nav>

  <div id="status" class="status">Loading Pokémon 151 cards...</div>

  <!-- TAB 1: PACK SIMULATOR -->
  <div id="pack-tab" class="tab-content active">
    <div id="pack-container">
      <div class="pack-stage">
        <div id="pack-frame" class="pack-frame">
          <img class="pack-art" src="https://images.pokemontcg.io/sv3pt5/symbol.png" alt="151 Pack" onerror="this.src='https://assets.pokemon.com/assets/cms2/img/cards/web/SV3PT5/SV3PT5_EN_1.png'">
          <div id="tear-strip" class="tear-guide">Swipe Across Line ➔</div>
        </div>
      </div>
      <button id="zoom-btn" class="action-btn" onclick="prepareToOpen()">Open Pack</button>
    </div>

    <div id="reveal-area">
      <div id="card-stack" class="card-stack"></div>
      <p id="card-counter-text">Tap top card to slide it away!</p>
      <button id="reset-pack-btn" class="action-btn" onclick="resetPackView()" style="display:none;">Open Another Pack</button>
    </div>
  </div>

  <!-- TAB 2: MY BINDER -->
  <div id="binder-tab" class="tab-content">
    <h2>My Collection</h2>
    <div id="binder-grid" class="card-grid"></div>
  </div>

  <!-- TAB 3: CARD DEX -->
  <div id="dex-tab" class="tab-content">
    <h2>151 Master Set (0/207)</h2>
    <div id="dex-grid" class="card-grid"></div>
  </div>

  <script>
    const SET_ID = 'sv3pt5';
    let cardDatabase = [];
    let collection = JSON.parse(localStorage.getItem('pkm151_collection')) || {};
    let isReady = false;

    let currentPack = [];
    let cardsRemaining = 10;

    let startX = 0;

    let cardPool = {
      common: [],
      uncommon: [],
      rare: [],
      doubleRare: [],
      ultraRare: [],
      illustrationRare: [],
      specialIllustrationRare: [],
      hyperRare: [],
      energy: []
    };

    async function loadSetData() {
      try {
        const response = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${SET_ID}&orderBy=number`);
        const data = await response.json();
        
        cardDatabase = data.data.sort((a, b) => parseInt(a.number) - parseInt(b.number));

        cardDatabase.forEach(card => {
          const rarity = card.rarity ? card.rarity.toLowerCase() : '';
          const supertype = card.supertype ? card.supertype.toLowerCase() : '';

          if (supertype === 'energy') {
            cardPool.energy.push(card);
          } else if (rarity.includes('hyper rare')) {
            cardPool.hyperRare.push(card);
          } else if (rarity.includes('special illustration')) {
            cardPool.specialIllustrationRare.push(card);
          } else if (rarity.includes('ultra rare')) {
            cardPool.ultraRare.push(card);
          } else if (rarity.includes('illustration')) {
            cardPool.illustrationRare.push(card);
          } else if (rarity.includes('double rare')) {
            cardPool.doubleRare.push(card);
          } else if (rarity.includes('uncommon')) {
            cardPool.uncommon.push(card);
          } else if (rarity.includes('common')) {
            cardPool.common.push(card);
          } else {
            cardPool.rare.push(card);
          }
        });

        document.getElementById('status').innerText = "151 Set Ready! Click 'Open Pack' to begin.";
        isReady = true;
        setupTearEvents();
        renderDex();
        renderBinder();
      } catch (err) {
        document.getElementById('status').innerText = "Error loading set data. Please refresh.";
        console.error(err);
      }
    }

    function prepareToOpen() {
      if (!isReady) {
        alert("Cards are loading, please wait a moment!");
        return;
      }
      document.getElementById('pack-frame').classList.add('zoomed');
      document.getElementById('zoom-btn').style.display = 'none';
      document.getElementById('status').innerText = "Swipe along the dotted line to rip open!";
    }

    function setupTearEvents() {
      const tearStrip = document.getElementById('tear-strip');

      // Mouse Drag Events
      tearStrip.addEventListener('mousedown', (e) => { startX = e.clientX; });
      tearStrip.addEventListener('mouseup', (e) => { checkDrag(e.clientX); });

      // Touch Events for Mobile / Tablet
      tearStrip.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
      tearStrip.addEventListener('touchend', (e) => { checkDrag(e.changedTouches[0].clientX); });

      // Click backup so it never gets stuck
      tearStrip.addEventListener('click', () => { ripPack(); });
    }

    function checkDrag(endX) {
      if (Math.abs(endX - startX) > 20) {
        ripPack();
      }
    }

    function ripPack() {
      document.getElementById('pack-container').style.display = 'none';
      document.getElementById('reveal-area').style.display = 'flex';
      generatePack();
      renderPackStack();
    }

    function getRandomCard(pool) {
      if (!pool || pool.length === 0) return cardPool.common[0];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function rollHitSlot() {
      const roll = Math.random() * 100;
      if (roll < 1.94) return getRandomCard(cardPool.hyperRare);
      if (roll < 5.05) return getRandomCard(cardPool.specialIllustrationRare);
      if (roll < 11.49) return getRandomCard(cardPool.ultraRare);
      if (roll < 19.99) return getRandomCard(cardPool.illustrationRare);
      if (roll < 33.27) return getRandomCard(cardPool.doubleRare);
      return getRandomCard(cardPool.rare);
    }

    function generatePack() {
      currentPack = [];

      for (let i = 0; i < 4; i++) currentPack.push(getRandomCard(cardPool.common));
      for (let i = 0; i < 3; i++) currentPack.push(getRandomCard(cardPool.uncommon));
      currentPack.push(getRandomCard(cardPool.energy));
      currentPack.push(getRandomCard([...cardPool.common, ...cardPool.uncommon, ...cardPool.rare]));
      currentPack.push(rollHitSlot());

      currentPack.forEach(card => {
        collection[card.id] = (collection[card.id] || 0) + 1;
      });

      localStorage.setItem('pkm151_collection', JSON.stringify(collection));
      renderBinder();
      renderDex();
    }

    function renderPackStack() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      cardsRemaining = 10;
      document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
      document.getElementById('reset-pack-btn').style.display = 'none';

      for (let i = currentPack.length - 1; i >= 0; i--) {
        const card = currentPack[i];
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.style.zIndex = currentPack.length - i;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;

        cardDiv.onclick = function() {
          if (!cardDiv.classList.contains('slide-out')) {
            cardDiv.classList.add('slide-out');
            cardsRemaining--;
            
            if (cardsRemaining > 0) {
              document.getElementById('card-counter-text').innerText = `Cards remaining: ${cardsRemaining}`;
            } else {
              document.getElementById('card-counter-text').innerText = `Pack finished!`;
              document.getElementById('reset-pack-btn').style.display = 'inline-block';
            }
          }
        };

        stack.appendChild(cardDiv);
      }
    }

    function resetPackView() {
      document.getElementById('pack-frame').classList.remove('zoomed');
      document.getElementById('zoom-btn').style.display = 'inline-block';
      document.getElementById('reveal-area').style.display = 'none';
      document.getElementById('pack-container').style.display = 'block';
      document.getElementById('status').innerText = "151 Set Ready! Click 'Open Pack' to begin.";
    }

    function renderBinder() {
      const binderGrid = document.getElementById('binder-grid');
      binderGrid.innerHTML = '';

      Object.keys(collection).forEach(cardId => {
        const card = cardDatabase.find(c => c.id === cardId);
        if (card) {
          const cardDiv = document.createElement('div');
          cardDiv.className = 'card';
          cardDiv.innerHTML = `
            <img src="${card.images.small}" alt="${card.name}">
            <div class="card-count">x${collection[cardId]}</div>
          `;
          binderGrid.appendChild(cardDiv);
        }
      });
    }

    function renderDex() {
      const dexGrid = document.getElementById('dex-grid');
      dexGrid.innerHTML = '';

      let totalOwned = 0;
      cardDatabase.forEach(card => {
        const count = collection[card.id] || 0;
        if (count > 0) totalOwned++;

        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${count === 0 ? 'unowned' : ''}`;
        cardDiv.innerHTML = `<img src="${card.images.small}" alt="${card.name}">`;
        dexGrid.appendChild(cardDiv);
      });

      document.querySelector('#dex-tab h2').innerText = `151 Master Set (${totalOwned}/${cardDatabase.length})`;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    window.onload = loadSetData;
  </script>
</body>
</html>
